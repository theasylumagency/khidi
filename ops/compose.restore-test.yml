# Task-owned synthetic restore drill. Dynamic loopback ports and project-scoped volumes only.
services:
  restore-source:
    build: ./pgbackrest
    image: khidi-pgbackrest-test:18.4-2.60.0
    environment:
      PGDATA: /var/lib/postgresql/18/khidi
      POSTGRES_USER: hub_migrator
      POSTGRES_PASSWORD: ${KHIDI_DRILL_MIGRATOR_PASSWORD:?Generated by ops:restore-drill}
      POSTGRES_DB: khidi_restore_test
      HUB_APP_DB_PASSWORD: ${KHIDI_DRILL_APP_PASSWORD:?Generated by ops:restore-drill}
      PGBACKREST_REPO1_CIPHER_PASS: ${KHIDI_DRILL_CIPHER:?Generated by ops:restore-drill}
    command: ["postgres", "-c", "archive_mode=on", "-c", "archive_command=pgbackrest --config=/etc/pgbackrest/pgbackrest.conf --stanza=khidi archive-push %p"]
    ports: ["127.0.0.1::5432", "127.0.0.1::5433"]
    volumes:
      - restore_source:/var/lib/postgresql
      - restore_repo:/var/lib/pgbackrest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_migrator -d khidi_restore_test"]
      interval: 2s
      timeout: 3s
      retries: 40
  media-source:
    image: khidi-minio-dev:2025-10-15-9e49d5e
    build: ../docker/minio
    environment:
      MINIO_ROOT_USER: ${KHIDI_DRILL_STORAGE_USER:?Generated by ops:restore-drill}
      MINIO_ROOT_PASSWORD: ${KHIDI_DRILL_STORAGE_PASSWORD:?Generated by ops:restore-drill}
    ports: ["127.0.0.1::9000"]
    volumes: ["media_source:/data"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 40
  media-target:
    image: khidi-minio-dev:2025-10-15-9e49d5e
    environment:
      MINIO_ROOT_USER: ${KHIDI_DRILL_STORAGE_USER:?Generated by ops:restore-drill}
      MINIO_ROOT_PASSWORD: ${KHIDI_DRILL_STORAGE_PASSWORD:?Generated by ops:restore-drill}
    ports: ["127.0.0.1::9000"]
    volumes: ["media_target:/data"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 40
volumes:
  restore_source:
  restore_repo:
  media_source:
  media_target:
