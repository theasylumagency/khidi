[global]
repo1-type=s3
repo1-path=/khidi/pgbackrest
repo1-s3-bucket=khidi-db-backup-prod
repo1-s3-endpoint=s3.us-west-or.io.cloud.ovh.us
repo1-s3-region=us-west-or
repo1-s3-key-type=shared
repo1-s3-uri-style=host
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=30
start-fast=y
log-level-console=info
log-level-file=off
lock-path=/var/run/pgbackrest

[khidi]
pg1-path=/var/lib/postgresql/18/docker
pg1-port=5432
pg1-socket-path=/var/run/postgresql
pg1-user=hub_migrator
pg1-database=agrotrade_hub
