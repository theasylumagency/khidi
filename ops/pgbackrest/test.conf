# Local restore drill only. Production uses the encrypted off-server S3 example.
[global]
repo1-type=posix
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=30
log-level-console=warn
log-level-file=off
lock-path=/tmp/pgbackrest
start-fast=y

[khidi]
pg1-path=/var/lib/postgresql/18/khidi
pg1-port=5432
pg1-user=hub_migrator
pg1-database=agrotrade_hub
pg1-socket-path=/var/run/postgresql
