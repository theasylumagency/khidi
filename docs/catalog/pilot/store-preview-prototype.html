<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>კატალოგის პილოტი · მაღაზიის ხედი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: the reviewer works inside a neutral store page (left) with a review rail (right); review chrome is green, the store stays brand-less grey. */
:root{
  --ink:#1d2421; --muted:#5f6b66; --line:#dde3df; --paper:#f4f6f5; --card:#ffffff;
  --review:#1f4d3a; --review-soft:#e3efe8; --flag:#b6541b; --flag-soft:#fbeadf; --ok:#2f7a4f; --edit:#2c5aa0; --edit-soft:#e4ecf8;
  --display:"Noto Serif Georgian", Georgia, serif; --body:"Noto Sans Georgian", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e7ece9; --muted:#9aa7a1; --line:#33403a; --paper:#161b19; --card:#1e2522;
    --review:#8fd0ae; --review-soft:#22352c; --flag:#f0a272; --flag-soft:#3a2a20; --ok:#7fd0a0; --edit:#9bbcf0; --edit-soft:#202c3d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e7ece9; --muted:#9aa7a1; --line:#33403a; --paper:#161b19; --card:#1e2522;
  --review:#8fd0ae; --review-soft:#22352c; --flag:#f0a272; --flag-soft:#3a2a20; --ok:#7fd0a0; --edit:#9bbcf0; --edit-soft:#202c3d;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--edit);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font:700 17px/1.2 var(--display);margin:0;color:var(--review)}
.top .grow{flex:1}
.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress .bar{width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--review)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--review);color:var(--card)}
.nav select{max-width:320px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:13px}
.btn.primary{background:var(--review);border-color:var(--review);color:var(--card);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;padding:20px;max-width:1500px;margin:0 auto}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}}
/* store frame */
.frame{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 auto;width:100%;transition:max-width .2s}
.frame.mobile{max-width:400px}
.storebar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.storebar b{font-weight:700;color:var(--ink);letter-spacing:.04em}
.storebar .search{flex:1;height:28px;border:1px solid var(--line);border-radius:14px;padding:0 12px;display:flex;align-items:center}
.crumbs{padding:12px 22px 0;font-size:12px;color:var(--muted)}
.page{padding:12px 22px 28px;display:flex;flex-direction:column;gap:22px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px}
.frame.mobile .hero{grid-template-columns:1fr}
.gallery .main{aspect-ratio:4/3;border-radius:10px;background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 10px,var(--card) 10px,var(--card) 20px);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:10px}
.thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.thumb{width:58px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.thumb.main{border:2px solid var(--ink)}
.buy h2{font:700 24px/1.25 var(--display);margin:0 0 6px;text-wrap:balance}
.frame.mobile .buy h2{font-size:20px}
.sub{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper)}
.price{display:flex;align-items:baseline;gap:10px;margin:14px 0 8px}
.price .p{font-size:22px;font-weight:700;color:var(--muted)}
.price small{font-size:12px;color:var(--muted)}
.cta{display:flex;gap:8px;flex-wrap:wrap}
.cta span{padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;background:var(--ink);color:var(--card);opacity:.85}
.cta span.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.keyfacts{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.keyfacts li{display:flex;gap:6px}.keyfacts li b{font-weight:600}
.sec h3{font:600 17px/1.3 var(--body);margin:0 0 10px}
.desc p{margin:0 0 10px;max-width:65ch}
table.specs{width:100%;border-collapse:collapse;font-size:14px}
table.specs td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.specs td:first-child{color:var(--muted);width:42%}
.kit li{margin:2px 0}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.relcard{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;display:flex;flex-direction:column;gap:4px;background:var(--card)}
.relcard .k{font-size:11px;text-transform:none;color:var(--muted)}
.relcard button{align-self:flex-start;border:0;background:none;padding:0;color:var(--edit);font-size:12px;text-decoration:underline}
.empty{color:var(--muted);font-size:13px;font-style:italic}
/* review overlay on sections */
.rv{position:relative;border-radius:10px}
.reviewing .rv{outline:1px dashed var(--line);outline-offset:8px}
.reviewing .rv.st-OK{outline:1px solid var(--ok)}
.reviewing .rv.st-EDIT{outline:2px solid var(--edit)}
.reviewing .rv.st-UNNEEDED{outline:1px solid var(--muted);opacity:.6}
.strip{display:none;margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--review-soft);font-size:13px;gap:8px;flex-wrap:wrap;align-items:center}
.reviewing .strip{display:flex}
.strip .lab{font-weight:600;color:var(--review);margin-right:4px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12px}
.pill[aria-pressed="true"].v-OK{background:var(--ok);border-color:var(--ok);color:var(--card)}
.pill[aria-pressed="true"].v-EDIT{background:var(--edit);border-color:var(--edit);color:var(--card)}
.pill[aria-pressed="true"].v-UNNEEDED{background:var(--muted);border-color:var(--muted);color:var(--card)}
.pill[aria-pressed="true"].v-UNK{background:var(--flag);border-color:var(--flag);color:var(--card)}
.strip .order{margin-left:auto;display:flex;gap:4px}
.strip input.reason{flex:1 1 100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--card)}
.strip input.reason.need{border-color:var(--flag);background:var(--flag-soft)}
.editbox{display:flex;flex-direction:column;gap:6px}
.editbox textarea,.editbox input[type=text]{width:100%;border:1px solid var(--edit);border-radius:6px;padding:8px;background:var(--edit-soft)}
.editbox textarea{min-height:130px;resize:vertical}
.rowedit{display:grid;grid-template-columns:1fr 1.3fr auto;gap:6px;align-items:center}
.rowedit.single{grid-template-columns:1fr auto}
.rowedit .mini{display:flex;gap:2px}
.mini button{border:1px solid var(--line);background:var(--card);border-radius:5px;padding:2px 7px;font-size:12px}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.addrow select,.addrow input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--card)}
.diff{font-size:12px;color:var(--muted)}
.diff del{color:var(--flag)} .diff ins{color:var(--ok);text-decoration:none}
.missing{display:none}
.reviewing .missing{display:block}
.missing textarea{width:100%;min-height:60px;border:1px dashed var(--review);border-radius:8px;padding:8px;background:var(--review-soft)}
/* rail */
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 84px);overflow:auto}
@media (max-width:1100px){.rail{position:static;max-height:none}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h4{margin:0 0 8px;font:600 14px/1.3 var(--body);color:var(--review)}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 10px;font-size:12px}
.tabs button[aria-selected="true"]{background:var(--review-soft);border-color:var(--review);color:var(--review)}
.old{white-space:pre-wrap;font-size:13px;max-height:420px;overflow:auto;color:var(--ink)}
.old h5{margin:8px 0 4px;font-size:12px;color:var(--muted);font-weight:600}
.q{border-top:1px solid var(--line);padding:10px 0;font-size:13px}
.q:first-of-type{border-top:0}
.q .f{font-size:11px;color:var(--muted)}
.q .opts{display:flex;gap:6px;margin:6px 0}
.q textarea{width:100%;min-height:52px;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--card)}
.q .src{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.checklist{font-size:13px;display:grid;gap:4px;margin:0;padding:0;list-style:none}
.checklist li{display:flex;justify-content:space-between;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--line);vertical-align:middle}
.dot.OK{background:var(--ok)}.dot.EDIT{background:var(--edit)}.dot.UNNEEDED{background:var(--muted)}.dot.UNK{background:var(--flag)}
.note{font-size:12px;color:var(--muted)}
.results{padding:20px;max-width:1200px;margin:0 auto}
.results table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:13px}
.results th,.results td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.results th{font-weight:600;color:var(--muted);font-size:12px}
.results pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:320px;overflow:auto;font-size:12px}
.survey textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card);margin-bottom:10px}
.hide{display:none!important}
.wrap:not(.reviewing){grid-template-columns:1fr}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>კატალოგის პილოტი</h1>
  <div class="progress"><span id="prog">0 / 20</span><span class="bar"><i id="progbar" style="width:0"></i></span></div>
  <div class="nav"><select id="pick" aria-label="ბარათის არჩევა"></select></div>
  <button class="btn" id="prev" type="button">← წინა</button>
  <button class="btn" id="next" type="button">შემდეგი →</button>
  <span class="grow"></span>
  <div class="seg" role="group" aria-label="რეჟიმი">
    <button type="button" id="m-review" aria-pressed="true">განხილვა</button>
    <button type="button" id="m-buyer" aria-pressed="false">მყიდველის თვალით</button>
  </div>
  <div class="seg" role="group" aria-label="ეკრანის ზომა">
    <button type="button" id="w-desk" aria-pressed="true">კომპიუტერი</button>
    <button type="button" id="w-mob" aria-pressed="false">ტელეფონი</button>
  </div>
  <button class="btn" id="go-results" type="button">შედეგები</button>
</header>

<main id="work" class="wrap reviewing">
  <div><div class="frame" id="frame"></div></div>
  <aside class="rail" id="rail"></aside>
</main>

<section id="results" class="results hide" aria-live="polite"></section>

     ${railTab==="old"?`<div class="old"><h5>სახელი</h5>${esc(src.name)}<h5>მოკლე აღწერა</h5>${esc(src.short||"—")}<h5>სრული აღწერა</h5>${esc(src.full||"—")}</div>`
      :c.questions.map((q,i)=>{const a=s.answers[i];return `<div class="q"><div class="f">${esc(q.field)}</div><div>${esc(q.prompt)}</div>
        <div class="opts"><button type="button" class="pill v-OK" data-qa="KNOWN" data-i="${i}" aria-pressed="${a.state==="KNOWN"}">პასუხი მაქვს</button><button type="button" class="pill v-UNK" data-qa="UNKNOWN" data-i="${i}" aria-pressed="${a.state==="UNKNOWN"}">არ ვიცი</button></div>
        ${a.state==="KNOWN"?`<textarea data-qt="${i}" aria-label="პასუხი">${esc(a.text)}</textarea><div class="src">${SOURCES.map(x=>`<button type="button" class="pill v-EDIT" data-qs="${esc(x)}" data-i="${i}" aria-pressed="${a.source===x}">${esc(x)}</button>`).join("")}</div>`:""}</div>`}).join("")}
   </div>
   <p class="note">პროტოტიპი: მონაცემები მხოლოდ ამ ბრაუზერში ინახება. ფოტოები ამ გვერდზე ჩანაცვლებულია ადგილის მაჩვენებლებით.</p>`;
  bindRail();
}
function checkCard(){
  const s=cs(), c=cur(), out=[];
  for(const [k,l] of FIELDS){const r=s.review[k];
    if(!r.verdict) {out.push(`შეაფასეთ: ${l}`);continue;}
    if((r.verdict==="EDIT"||r.verdict==="UNNEEDED")&&!r.reason.trim()) out.push(`${l}: მიუთითეთ მიზეზი`);
  }
  s.answers.forEach((a,i)=>{if(!a.state) out.push(`უპასუხეთ კითხვას ${i+1}`); else if(a.state==="KNOWN"&&(!a.text.trim()||!a.source)) out.push(`კითხვა ${i+1}: პასუხი და წყარო`);});
  return out;
}
function setEdited(f){const s=cs(); const ch=!same(s.orig[f],s.value[f]); s.review[f].verdict=ch?"EDIT":(s.review[f].verdict==="EDIT"?"":s.review[f].verdict);}
function bindFrame(){
  const fr=document.getElementById("frame"), s=cs();
  fr.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const f=b.dataset.f,r=s.review[f];r.verdict=r.verdict===b.dataset.v?"":b.dataset.v; if(r.verdict==="UNNEEDED"){} commit();});
  fr.querySelectorAll("[data-unk]").forEach(b=>b.onclick=()=>{const r=s.review[b.dataset.unk];r.unknown=!r.unknown;commit();});
  fr.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{flushEditor();editing=editing===b.dataset.edit?null:b.dataset.edit;commit();});
  fr.querySelectorAll("[data-reason]").forEach(i=>i.oninput=()=>{s.review[i.dataset.reason].reason=i.value;save();i.classList.toggle("need",!i.value.trim());renderRail();});
  fr.querySelectorAll("[data-ord]").forEach(b=>b.onclick=()=>{const o=s.order,i=o.indexOf(b.dataset.f),j=b.dataset.ord==="up"?i-1:i+1;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];commit();});
  fr.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{const i=CARDS.findIndex(x=>x.wp==b.dataset.goto);if(i>=0){go(i)}});
  const miss=document.getElementById("miss"); if(miss) miss.oninput=()=>{s.missing=miss.value;save();};
  const dn=fr.querySelector("[data-act=done]"); if(dn) dn.onclick=()=>{flushEditor();editing=null;commit();};
  const box=fr.querySelector("[data-list]");
  if(box){const f=box.dataset.list,pairs=box.dataset.pairs==="1";
    box.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{flushEditor();const L=s.value[f],i=+b.dataset.i;
      if(b.dataset.mv==="add") L.push(pairs?"ახალი ველი: ":"ახალი სტრიქონი");
      if(b.dataset.mv==="del") L.splice(i,1);
      if(b.dataset.mv==="up"&&i>0) [L[i-1],L[i]]=[L[i],L[i-1]];
      if(b.dataset.mv==="down"&&i<L.length-1) [L[i+1],L[i]]=[L[i],L[i+1]];
      setEdited(f);commit();});}
  fr.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{const L=s.value.photos,i=+b.dataset.i;if(b.dataset.ph==="del")L.splice(i,1);if(b.dataset.ph==="up"&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];setEdited("photos");commit();});
  fr.querySelectorAll("[data-ln]").forEach(b=>b.onclick=()=>{const L=s.value.links;
    if(b.dataset.ln==="del")L.splice(+b.dataset.i,1);
    if(b.dataset.ln==="add"){const w=document.getElementById("ln-wp").value,k=document.getElementById("ln-kind").value;if(!w)return;const e=k+":"+w;if(!L.some(x=>x.split(":")[1]===w))L.push(e);}
    setEdited("links");commit();});
}
function flushEditor(){
  const s=cs();
  const n=document.getElementById("ed-name"); if(n){s.value.name=[n.value.trim()];setEdited("name");}
  const d=document.getElementById("ed-desc"); if(d){s.value.description=[d.value.trim()];setEdited("description");}
  const box=document.querySelector("[data-list]");
  if(box){const f=box.dataset.list,pairs=box.dataset.pairs==="1";const rows=[...box.querySelectorAll(".rowedit")];
    s.value[f]=rows.map(r=>{const k=r.querySelector('[data-part="k"]'),v=r.querySelector('[data-part="v"]');return pairs?((k.value.trim()?k.value.trim()+": ":"")+v.value.trim()):v.value.trim()}).filter(x=>x&&x!==":");
    setEdited(f);}
}
function bindRail(){
  const r=document.getElementById("rail"), s=cs();
  r.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{railTab=b.dataset.tab;renderRail();});
  r.querySelectorAll("[data-qa]").forEach(b=>b.onclick=()=>{const a=s.answers[+b.dataset.i];a.state=a.state===b.dataset.qa?"":b.dataset.qa;commit();});
  r.querySelectorAll("[data-qt]").forEach(t=>t.oninput=()=>{s.answers[+t.dataset.qt].text=t.value;save();});
  r.querySelectorAll("[data-qs]").forEach(b=>b.onclick=()=>{const a=s.answers[+b.dataset.i];a.source=a.source===b.dataset.qs?"":b.dataset.qs;commit();});
  const fin=document.getElementById("finish"); if(fin) fin.onclick=()=>{flushEditor();editing=null;s.submitted=true;save();const n=CARDS.findIndex(x=>!state.cards[x.wp].submitted);if(n>=0)go(n);else showResults();};
}
function commit(){save();render();}
function go(i){flushEditor();editing=null;idx=i;railTab="questions";render();window.scrollTo({top:0});}
function showResults(){
  flushEditor();editing=null;
  document.getElementById("work").classList.add("hide");
  const R=document.getElementById("results"); R.classList.remove("hide");
  const rows=CARDS.map((c,i)=>{const s=state.cards[c.wp];const edits=FIELDS.filter(([k])=>s.review[k].verdict==="EDIT").length;
    const unk=s.answers.filter(a=>a.state==="UNKNOWN").length;const moved=!same(s.order,MOVABLE);
    return `<tr><td>${i+1}</td><td>${esc(s.value.name[0])}</td>${FIELDS.map(([k])=>`<td><span class="dot ${s.review[k].verdict}"></span>${s.review[k].unknown?' <span class="dot UNK"></span>':""}</td>`).join("")}<td>${edits}</td><td>${unk}/${s.answers.length}</td><td>${moved?"კი":""}</td><td>${s.submitted?"✓":""}</td></tr>`}).join("");
  const all=CARDS.every(c=>state.cards[c.wp].submitted);
  const exportData={round:1,cards:CARDS.map(c=>{const s=state.cards[c.wp];return {wp:c.wp,submitted:s.submitted,fields:Object.fromEntries(FIELDS.map(([k])=>[k,{before:s.orig[k],after:s.value[k],...s.review[k]}])),sectionOrder:s.order,missing:s.missing,answers:c.questions.map((q,i)=>({question:q.prompt,...s.answers[i]}))}}),survey:state.survey};
  R.innerHTML=`<h2 style="font:700 22px/1.3 var(--display);margin:0 0 12px">ოცეული 1 · შედეგები</h2>
   <p class="note">ფერი: <span class="dot OK"></span> სწორია · <span class="dot EDIT"></span> შეცვლილი · <span class="dot UNNEEDED"></span> არ სჭირდება · <span class="dot UNK"></span> ვერ ადასტურებს</p>
   <div style="overflow-x:auto"><table><thead><tr><th>#</th><th>პროდუქტი</th>${FIELDS.map(([,l])=>`<th>${l}</th>`).join("")}<th>ცვლილება</th><th>არ ვიცი</th><th>რიგი შეცვალა</th><th>დასრ.</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="panel survey" style="margin-top:18px"><h4>დამამთავრებელი კითხვები ${all?"":"(ჩაირთვება 20 ბარათის შემდეგ)"}</h4>${SURVEY.map((q,i)=>`<label for="sv${i}">${esc(q)}</label><textarea id="sv${i}" ${all?"":"disabled"}>${esc(state.survey[i])}</textarea>`).join("")}</div>
   <div class="panel" style="margin-top:18px"><h4>ჩაწერილი მონაცემები (JSON)</h4><p class="note">ეს არის ის სტრუქტურა, რასაც სისტემა თითო ბარათზე ინახავს: ველის ძველი და ახალი მნიშვნელობა, შეფასება, მიზეზი, სექციების რიგი და პასუხები წყაროთი.</p>
   <div class="cta" style="margin:8px 0"><button class="btn" id="copy" type="button">კოპირება</button><button class="btn" id="back" type="button">ბარათებზე დაბრუნება</button><button class="btn" id="reset" type="button">პროტოტიპის გასუფთავება</button></div><pre id="json"></pre></div>`;
  document.getElementById("json").textContent=JSON.stringify(exportData,null,1);
  SURVEY.forEach((_,i)=>{const t=document.getElementById("sv"+i);t.oninput=()=>{state.survey[i]=t.value;save();}});
  document.getElementById("copy").onclick=async e=>{try{await navigator.clipboard.writeText(document.getElementById("json").textContent);e.target.textContent="დაკოპირდა"}catch(err){e.target.textContent="კოპირება ვერ მოხერხდა"}};
  document.getElementById("back").onclick=()=>{R.classList.add("hide");document.getElementById("work").classList.remove("hide");render();};
  document.getElementById("reset").onclick=e=>{if(e.target.dataset.sure){state=init();save();R.classList.add("hide");document.getElementById("work").classList.remove("hide");idx=0;render();}else{e.target.dataset.sure=1;e.target.textContent="დააჭირეთ კიდევ ერთხელ"}};
}
document.getElementById("pick").onchange=e=>go(+e.target.value);
document.getElementById("prev").onclick=()=>go((idx+19)%20);
document.getElementById("next").onclick=()=>go((idx+1)%20);
document.getElementById("go-results").onclick=showResults;
function setMode(m){mode=m;document.getElementById("m-review").setAttribute("aria-pressed",m==="review");document.getElementById("m-buyer").setAttribute("aria-pressed",m==="buyer");document.getElementById("work").classList.toggle("reviewing",m==="review");document.getElementById("rail").classList.toggle("hide",m!=="review");if(m!=="review"){flushEditor();editing=null;}render();}
function setWidth(w){width=w;document.getElementById("w-desk").setAttribute("aria-pressed",w==="desk");document.getElementById("w-mob").setAttribute("aria-pressed",w==="mob");render();}
document.getElementById("m-review").onclick=()=>setMode("review");
document.getElementById("m-buyer").onclick=()=>setMode("buyer");
document.getElementById("w-desk").onclick=()=>setWidth("desk");
document.getElementById("w-mob").onclick=()=>setWidth("mob");
setInterval(()=>{if(document.visibilityState==="visible"&&!cs().submitted){cs().seconds+=5;save();}},5000);
render();
</script>
</body>
</html>
