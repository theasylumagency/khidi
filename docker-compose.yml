services:
  minio:
    image: khidi-minio-dev:2025-10-15-9e49d5e
    build:
      context: ./docker/minio
    profiles: ["media"]
    container_name: khidi-minio-dev
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_DEV_ROOT_USER:-khidi-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_DEV_ROOT_PASSWORD:-khidi_minio_dev_password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - khidi_media:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
  postgres:
    build:
      context: ./docker/postgres
    image: khidi-postgres:18.4-pgbackrest-2.60.0
    container_name: agrotrade-hub-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60s
      - -c
      - archive_command=pgbackrest --config=/etc/pgbackrest/pgbackrest.conf --stanza=khidi archive-push %p
    env_file:
      - .backup.env
    environment:
      POSTGRES_USER: ${HUB_MIGRATOR_DB_USER:-hub_migrator}
      POSTGRES_PASSWORD: ${HUB_MIGRATOR_DB_PASSWORD:-hub_migrator_dev_password}
      POSTGRES_DB: ${HUB_DB_NAME:-agrotrade_hub_dev}
      HUB_APP_DB_PASSWORD: ${HUB_APP_DB_PASSWORD:-hub_app_dev_password}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - agrotrade_pgdata:/var/lib/postgresql
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
      - ./ops/pgbackrest/pgbackrest.production.conf:/etc/pgbackrest/pgbackrest.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HUB_MIGRATOR_DB_USER:-hub_migrator} -d ${HUB_DB_NAME:-agrotrade_hub_dev}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  khidi_media:
  agrotrade_pgdata:
